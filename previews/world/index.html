<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Veyra world art preview</title>
<style>
body{margin:0;background:#0b0f1a;color:#e6dcc4;font:14px/1.4 system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
h2{font:600 15px system-ui;color:#ffd98a;margin:18px 0 8px}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.banners{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.banners figure{margin:0}.banners figcaption{font-size:12px;color:#8a93a8;margin-top:2px}
canvas.px{display:block;width:100%;image-rendering:pixelated}
</style></head>
<body><div id="root" class="wrap"></div><script type="module" src="./main.jsx"></script></body></html>
